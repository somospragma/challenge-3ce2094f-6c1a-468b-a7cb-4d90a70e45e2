version: '3.8'
services:
  app:
    build:.
    ports:
      - '8080:8080'
    depends_on:
      - db
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: productos
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
  monitoring:
    image: prometheus/prometheus
    ports:
      - '9090:9090'
    volumes:
      -./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app